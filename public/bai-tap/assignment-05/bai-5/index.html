<style>
body { font-family: Arial, sans-serif; max-width: 460px; margin: 40px auto; padding: 30px 20px; color: #202735; }

.row { display: flex; gap: 8px; margin-top: 8px; }
input { flex: 1; min-width: 0; padding: 9px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
button { padding: 9px 18px; background: #1a56db; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; }
button:disabled { opacity: .7; cursor: wait; }
#box { margin-top: 20px; padding: 20px; border-radius: 10px; display: none; overflow-wrap: anywhere; }
.loading { background: #fef9e7; color: #7d6608; }
.success { background: #eafaf1; color: #0d6641; font-size: 17px; line-height: 1.9; }
.error { background: #fdecea; color: #c0392b; }
.temp { font-size: 42px; font-weight: bold; color: #1a56db; }
.coordinates { color: #59645f; }
a { color: #1a56db; text-underline-offset: 3px; }
:focus-visible { outline: 3px solid #d78c00; outline-offset: 3px; }
.credits { margin-top: 24px; font-size: 13px; line-height: 1.6; color: #59645f; }
</style></head>
